<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greek Drill — Paradigms &amp; Vocabulary</title>
<style>
  :root{
    --ink:#1c1c1e; --muted:#6b6b73; --line:#d8dae6; --panel:#fff;
    --bg:#f4f5fa; --accent:#5b6bbf; --accent-soft:#e6e9f8;
    --good:#1e7a4d; --good-bg:#e2f4ea; --bad:#b02a37; --bad-bg:#fbe6e8;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    line-height:1.5;padding:24px 16px 60px}
  .wrap{max-width:900px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 18px}
  .gk{font-family:"GFS Didot","Palatino Linotype",Palatino,"Times New Roman",serif}
  nav{display:flex;gap:6px;flex-wrap:wrap}
  nav.para{margin-bottom:10px}
  nav.mode{margin-bottom:18px;padding-top:10px;border-top:1px solid var(--line)}
  nav button{border:1px solid var(--line);background:var(--panel);color:var(--ink);
    padding:8px 14px;border-radius:999px;cursor:pointer;font-size:14px}
  nav.para button{font-size:15px;padding:9px 18px}
  nav button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
  .panel h2{font-size:16px;margin:0 0 12px}
  .hint{color:var(--muted);font-size:13px;margin:0 0 14px}
  table{border-collapse:collapse;width:100%;margin-bottom:6px}
  caption{text-align:left;font-style:italic;color:var(--muted);padding-bottom:6px;font-size:14px}
  th,td{border:1px solid var(--line);padding:8px 10px;text-align:center}
  th{background:#f7f8fc;font-weight:600;font-size:13px;color:var(--muted)}
  th.rowh{text-align:left;font-style:italic;width:104px}
  td.gkcell{font-family:"GFS Didot","Palatino Linotype",Palatino,serif;font-size:19px}
  td.none{background:#fafbfe;color:#c3c6d6}
  td.cell{cursor:pointer;height:44px;font-family:"GFS Didot","Palatino Linotype",Palatino,serif;font-size:19px}
  td.cell:hover{background:#f7f8fc}
  td.cell.sel{outline:2px solid var(--accent);outline-offset:-2px;background:var(--accent-soft)}
  td.cell.ok{background:var(--good-bg);color:var(--good)}
  td.cell.no{background:var(--bad-bg);color:var(--bad)}
  td.cell.pick{background:var(--accent-soft)}
  .bank{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 4px;min-height:38px}
  .bank button{font-family:"GFS Didot","Palatino Linotype",Palatino,serif;font-size:18px;
    padding:5px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer}
  .bank button:hover{border-color:var(--accent);background:var(--accent-soft)}
  .bank button.spent{display:none}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
  .btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:8px 16px;
    border-radius:8px;cursor:pointer;font-size:14px}
  .btn.ghost{background:#fff;color:var(--accent)}
  .score{margin-left:auto;font-size:14px;color:var(--muted)}
  .prompt{font-size:21px;margin:6px 0 18px}
  .prompt b{color:var(--accent)}
  .choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
  .choices button{font-family:"GFS Didot","Palatino Linotype",Palatino,serif;font-size:23px;
    padding:14px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer}
  .choices button.txt{font-family:inherit;font-size:15px}
  .choices button:hover{border-color:var(--accent)}
  .choices button.ok{background:var(--good-bg);border-color:var(--good);color:var(--good)}
  .choices button.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
  .fb{margin-top:14px;font-size:14px;min-height:22px}
  .fb.ok{color:var(--good)} .fb.no{color:var(--bad)}
  .tips{font-size:14px;color:var(--muted);margin:0;padding-left:20px}
  .tips li{margin-bottom:7px}
  td.inp{padding:2px}
  td.inp input{width:100%;border:none;outline:none;background:transparent;text-align:center;
    font-family:"GFS Didot","Palatino Linotype",Palatino,serif;font-size:19px;padding:8px 4px;color:inherit}
  td.inp input:focus{background:var(--accent-soft);border-radius:4px}
  td.inp.ok{background:var(--good-bg);color:var(--good)}
  td.inp.no{background:var(--bad-bg);color:var(--bad)}
  .legend{background:#f7f8fc;border:1px solid var(--line);border-radius:10px;padding:12px 14px;
    font-size:13px;color:var(--muted);margin-bottom:14px}
  .legend code{background:#fff;border:1px solid var(--line);border-radius:4px;padding:1px 5px;
    font-size:12px;color:var(--ink)}
  .legend .gk{font-size:16px;color:var(--ink)}
  .legend div{margin-bottom:6px}
  .legend div:last-child{margin-bottom:0}
  label.chk{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .chips button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;
    font-size:13px;cursor:pointer;color:var(--ink)}
  .chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chips button small{opacity:.65;margin-left:4px}
  .opts{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin:14px 0 4px}
  .opts fieldset{border:none;padding:0;margin:0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .opts legend{display:none}
  .opts .lbl{font-size:13px;color:var(--muted);margin-right:2px}
  .opts select{font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .card{text-align:center;padding:26px 16px 20px}
  .card .q{font-size:30px;margin-bottom:6px}
  .card .q.gk{font-family:"GFS Didot","Palatino Linotype",Palatino,serif;font-size:38px}
  .card .meta{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .card .a{font-size:22px;margin-top:18px;padding-top:18px;border-top:1px solid var(--line);color:var(--accent)}
  .card .a.gk{font-family:"GFS Didot","Palatino Linotype",Palatino,serif;font-size:30px}
  .card .a.hidden{visibility:hidden}
  .bigin{font-family:"GFS Didot","Palatino Linotype",Palatino,serif;font-size:26px;text-align:center;
    padding:10px 14px;border:1px solid var(--line);border-radius:10px;width:100%;max-width:340px;outline:none}
  .bigin:focus{border-color:var(--accent);background:var(--accent-soft)}
  .missed{font-size:14px;margin-top:10px}
  .missed li{margin-bottom:4px}
  .missed .gk{font-size:18px}
  .barwrap{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:14px}
  .bar{height:100%;background:var(--accent);width:0;transition:width .25s}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  @media(max-width:660px){.grid2{grid-template-columns:1fr}}
  .hidebtn{font-size:13px;margin-left:8px;padding:4px 10px}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>

  <nav class="para" id="paraNav"></nav>
  <nav class="mode" id="modeNav"></nav>

  <div id="content"></div>
</div>

<script>
/* ---------------- data ---------------- */
const GEN = ["m.","f.","n."];
const GENNAME = {"m.":"masculine","f.":"feminine","n.":"neuter"};

const PARADIGMS = {
  article: {
    label: "Article",
    title: 'The Definite Article <span class="gk">ὁ, ἡ, τό</span>',
    subtitle: "‘the’ — 24 cells, but only 17 distinct forms.",
    rows: { Singular:["Nominative","Accusative","Genitive","Dative"],
            Plural:["Nominative","Accusative","Genitive","Dative"] },
    data: {
      Singular:{
        Nominative:["ὁ","ἡ","τό"], Accusative:["τόν","τήν","τό"],
        Genitive:["τοῦ","τῆς","τοῦ"], Dative:["τῷ","τῇ","τῷ"] },
      Plural:{
        Nominative:["οἱ","αἱ","τά"], Accusative:["τούς","τᾱ́ς","τά"],
        Genitive:["τῶν","τῶν","τῶν"], Dative:["τοῖς","ταῖς","τοῖς"] }
    },
    tips: [
      'Every form starts with <span class="gk">τ-</span> except four: <span class="gk">ὁ, ἡ, οἱ, αἱ</span> — the masc./fem. nominatives, which take a rough breathing instead.',
      'Neuter nominative = neuter accusative, always: <span class="gk">τό / τό</span>, <span class="gk">τά / τά</span>.',
      'Masculine and neuter share genitive and dative throughout: <span class="gk">τοῦ, τῷ, τῶν, τοῖς</span>.',
      'Genitive plural is <span class="gk">τῶν</span> for all three genders — one form, three jobs.',
      'Count the repeats: <span class="gk">τό</span> ×2, <span class="gk">τοῦ</span> ×2, <span class="gk">τῷ</span> ×2, <span class="gk">τά</span> ×2, <span class="gk">τοῖς</span> ×2, <span class="gk">τῶν</span> ×3. Everything else appears once.'
    ]
  },
  kalos: {
    label: "Adjective καλός",
    title: 'The Adjective <span class="gk">καλ-ός, -ή, -όν</span>',
    subtitle: "‘fine, beautiful, good’ — stem καλ-, endings follow 2nd/1st/2nd declension.",
    rows: { Singular:["Nominative","Accusative","Genitive","Dative","Vocative"],
            Plural:["Nominative","Accusative","Genitive","Dative"] },
    data: {
      Singular:{
        Nominative:["καλός","καλή","καλόν"], Accusative:["καλόν","καλήν","καλόν"],
        Genitive:["καλοῦ","καλῆς","καλοῦ"], Dative:["καλῷ","καλῇ","καλῷ"],
        Vocative:["καλέ",null,null] },
      Plural:{
        Nominative:["καλοί","καλαί","καλά"], Accusative:["καλούς","καλᾱ́ς","καλά"],
        Genitive:["καλῶν","καλῶν","καλῶν"], Dative:["καλοῖς","καλαῖς","καλοῖς"] }
    },
    tips: [
      'The stem never changes — only the ending. Learn <span class="gk">-ός -ή -όν</span> and every adjective of this type follows.',
      'Masc. and neut. use 2nd-declension endings (<span class="gk">-ος -ον -ου -ῳ</span>); fem. uses 1st-declension (<span class="gk">-η -ην -ης -ῃ</span>).',
      'Compare the article ending-for-ending: <span class="gk">τῷ / καλῷ</span>, <span class="gk">τῆς / καλῆς</span>, <span class="gk">τοῖς / καλοῖς</span>, <span class="gk">τῶν / καλῶν</span>. The article is essentially this paradigm with the stem stripped away.',
      'The only separate vocative is masculine singular <span class="gk">καλέ</span>; fem. and neut. vocatives are identical to their nominatives.',
      'Accent stays on the ending (<span class="gk">-ός</span> type), and follows the article’s accent pattern: circumflex in gen./dat., acute elsewhere.'
    ]
  }
};

const NUMS = ["Singular","Plural"];
function cellsOf(p){
  const out=[];
  NUMS.forEach(n=>p.rows[n].forEach(c=>GEN.forEach((g,i)=>{
    const v=p.data[n][c][i];
    if(v) out.push({num:n,cs:c,gi:i,g:g,val:v});
  })));
  return out;
}
const $ = s=>document.querySelector(s);
const shuffle = a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
const rand = a=>a[Math.floor(Math.random()*a.length)];
const label = c=>`${c.cs.toLowerCase()} ${GENNAME[c.g]} ${c.num.toLowerCase()}`;

function table(p,num,cellFn){
  let h = `<table><caption>${num}</caption><tr><th></th>`;
  GEN.forEach(g=>h+=`<th>${g}</th>`); h+="</tr>";
  p.rows[num].forEach(c=>{
    h += `<tr><th class="rowh">${c}</th>`;
    GEN.forEach((g,i)=> h += (p.data[num][c][i]===null
      ? `<td class="none">—</td>` : cellFn(num,c,i)));
    h += "</tr>";
  });
  return h+"</table>";
}
function tables(p,cellFn){ return NUMS.map(n=>table(p,n,cellFn)).join(""); }

/* ---------------- shell ---------------- */
let curP = "article", curMode = "study";
const MODES = [["study","Study"],["fill","Fill the Grid"],["type","Type It"],["quiz","Quick Quiz"],["spot","Spot It"]];

/* --------- Greek typing: Latin keys -> polytonic Greek --------- */
const GK_LETTERS = {a:"α",b:"β",g:"γ",d:"δ",e:"ε",z:"ζ",h:"η",q:"θ",i:"ι",k:"κ",l:"λ",m:"μ",
  n:"ν",c:"ξ",o:"ο",p:"π",r:"ρ",s:"σ",t:"τ",u:"υ",f:"φ",x:"χ",y:"ψ",w:"ω",v:"ϝ",j:"ς"};
const GK_MARKS = {"(":"\u0314", ")":"\u0313", "/":"\u0301", "\\":"\u0300",
  "=":"\u0342", "|":"\u0345", "+":"\u0308", "_":"\u0304"};
function toGreek(s){
  let out = "";
  for(const ch of s){
    if(GK_MARKS[ch]) out += GK_MARKS[ch];
    else out += (GK_LETTERS[ch.toLowerCase()] ?? ch);
  }
  out = out.replace(/ς/g,"σ").replace(/σ(?=[^\p{L}]*$)/u,"ς");
  return out.normalize("NFC");
}
const bare = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ς/g,"σ");
function sameForm(a,b,strict){
  a = a.normalize("NFC").trim(); b = b.normalize("NFC").trim();
  return strict ? a===b : bare(a)===bare(b);
}

$("#paraNav").innerHTML = Object.entries(PARADIGMS)
  .map(([k,v])=>`<button data-p="${k}">${v.label}</button>`).join("")
  + `<button data-p="vocab">Vocabulary</button>`;
$("#modeNav").innerHTML = MODES.map(([k,v])=>`<button data-m="${k}">${v}</button>`).join("");
$("#paraNav").onclick = e=>{ if(e.target.dataset.p){ curP=e.target.dataset.p; render(); } };
$("#modeNav").onclick = e=>{ if(e.target.dataset.m){ curMode=e.target.dataset.m; render(); } };

function render(){
  $("#paraNav").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.p===curP));
  if(curP === "vocab"){
    $("#modeNav").style.display = "none";
    $("#title").innerHTML = "Vocabulary";
    $("#subtitle").textContent = `Mounce, Basics of Biblical Greek — ${VOCAB.reduce((n,w)=>n+w.items.length,0)} words across ${VOCAB.length} weeks.`;
    renderVocab();
    return;
  }
  $("#modeNav").style.display = "";
  const p = PARADIGMS[curP];
  $("#title").innerHTML = p.title;
  $("#subtitle").textContent = p.subtitle;
  $("#paraNav").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.p===curP));
  $("#modeNav").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.m===curMode));
  ({study:renderStudy, fill:renderFill, type:renderType, quiz:renderQuiz, spot:renderSpot})[curMode](p);
}

/* ---------------- study ---------------- */
function renderStudy(p){
  $("#content").innerHTML = `
    <div class="panel">
      <h2>Reference <button class="btn ghost hidebtn" id="toggleRef">Hide</button></h2>
      <div class="grid2" id="refTables">${tables(p,(n,c,i)=>`<td class="gkcell">${p.data[n][c][i]}</td>`)}</div>
    </div>
    <div class="panel">
      <h2>Patterns worth noticing</h2>
      <ul class="tips">${p.tips.map(t=>`<li>${t}</li>`).join("")}</ul>
    </div>`;
  $("#toggleRef").onclick = e=>{
    const t=$("#refTables"), hid = t.style.visibility==="hidden";
    t.style.visibility = hid?"visible":"hidden";
    e.target.textContent = hid?"Hide":"Show";
  };
}

/* ---------------- fill the grid ---------------- */
function renderFill(p){
  $("#content").innerHTML = `
    <div class="panel">
      <h2>Fill the Grid</h2>
      <p class="hint">The bank holds <em>exactly</em> the tiles the grid needs — one per cell, duplicates included.
      Every tile must be used, so you have to know how many times each form repeats. Click a cell, then a tile;
      click a filled cell to send its tile back.</p>
      <div class="grid2" id="fillTables">${tables(p,(n,c,i)=>
        `<td class="cell" data-n="${n}" data-c="${c}" data-i="${i}"></td>`)}</div>
      <div class="bank" id="bank"></div>
      <div class="row">
        <button class="btn" id="checkFill">Check</button>
        <button class="btn ghost" id="revealFill">Reveal</button>
        <button class="btn ghost" id="resetFill">Reset</button>
        <span class="score" id="fillScore"></span>
      </div>
    </div>`;

  const cells = cellsOf(p);
  let tiles = shuffle(cells.map((c,ix)=>({id:ix, form:c.val, used:false})));
  let sel = null;

  const bankEl = $("#bank"), scoreEl = $("#fillScore");
  function drawBank(){
    bankEl.innerHTML = tiles.map(t=>
      `<button data-id="${t.id}" class="${t.used?"spent":""}">${t.form}</button>`).join("");
    bankEl.querySelectorAll("button").forEach(b=> b.onclick = ()=>place(+b.dataset.id));
    const left = tiles.filter(t=>!t.used).length;
    scoreEl.textContent = left ? `${left} tile${left>1?"s":""} left` : "All tiles placed — hit Check.";
  }
  function place(id){
    const t = tiles.find(x=>x.id===id);
    if(!sel){ scoreEl.textContent = "Pick a cell first."; return; }
    sel.textContent = t.form; sel.dataset.tile = id;
    t.used = true;
    sel.classList.remove("sel","ok","no");
    const list = [...$("#fillTables").querySelectorAll(".cell")];
    const next = list.slice(list.indexOf(sel)+1).find(td=>!td.textContent);
    sel = null;
    if(next){ next.classList.add("sel"); sel = next; }
    drawBank();
  }
  $("#fillTables").querySelectorAll(".cell").forEach(td=>{
    td.onclick = ()=>{
      td.classList.remove("ok","no");
      if(td.textContent){
        const t = tiles.find(x=>x.id===+td.dataset.tile);
        if(t) t.used=false;
        td.textContent=""; delete td.dataset.tile; drawBank(); return;
      }
      $("#fillTables").querySelectorAll(".sel").forEach(x=>x.classList.remove("sel"));
      td.classList.add("sel"); sel = td;
    };
  });
  $("#checkFill").onclick = ()=>{
    let ok=0, total=0;
    $("#fillTables").querySelectorAll(".cell").forEach(td=>{
      total++; td.classList.remove("ok","no","sel");
      const want = p.data[td.dataset.n][td.dataset.c][+td.dataset.i];
      if(!td.textContent) return;
      const right = td.textContent===want;
      td.classList.add(right?"ok":"no");
      if(right) ok++;
    });
    scoreEl.textContent = `${ok} / ${total} correct`;
  };
  $("#revealFill").onclick = ()=>{
    $("#fillTables").querySelectorAll(".cell").forEach(td=>{
      td.textContent = p.data[td.dataset.n][td.dataset.c][+td.dataset.i];
      td.classList.remove("no","sel"); td.classList.add("ok");
    });
    tiles.forEach(t=>t.used=true); drawBank();
    scoreEl.textContent = "Answers shown.";
  };
  $("#resetFill").onclick = ()=>renderFill(p);
  drawBank();
}

/* ---------------- type it ---------------- */
let strictAccents = false;
function renderType(p){
  $("#content").innerHTML = `
    <div class="panel">
      <h2>Type It</h2>
      <p class="hint">Type the whole paradigm from memory. No Greek keyboard needed — type Latin letters
      and they convert as you go. Tab moves to the next cell.</p>
      <div class="legend">
        <div><code>a b g d e z h q i k l m n c o p r s t u f x y w</code> &rarr;
          <span class="gk">α β γ δ ε ζ η θ ι κ λ μ ν ξ ο π ρ σ τ υ φ χ ψ ω</span>
          <em>(final sigma is automatic)</em></div>
        <div>Diacritics go <em>after</em> the vowel:
          <code>(</code> rough &middot; <code>)</code> smooth &middot; <code>/</code> acute &middot;
          <code>\\</code> grave &middot; <code>=</code> circumflex &middot; <code>|</code> iota subscript &middot;
          <code>_</code> macron</div>
        <div>So <code>h(</code> &rarr; <span class="gk">ἡ</span> &middot;
          <code>tou=</code> &rarr; <span class="gk">τοῦ</span> &middot;
          <code>tw=|</code> &rarr; <span class="gk">τῷ</span> &middot;
          <code>ta_/s</code> &rarr; <span class="gk">τᾱ́ς</span> &middot;
          <code>kaloi=s</code> &rarr; <span class="gk">καλοῖς</span></div>
      </div>
      <div class="grid2" id="typeTables">${tables(p,(n,c,i)=>
        `<td class="inp" data-n="${n}" data-c="${c}" data-i="${i}"><input type="text" spellcheck="false" autocapitalize="off" autocomplete="off"></td>`)}</div>
      <div class="row">
        <button class="btn" id="checkType">Check</button>
        <button class="btn ghost" id="revealType">Reveal</button>
        <button class="btn ghost" id="resetType">Reset</button>
        <label class="chk"><input type="checkbox" id="strict" ${strictAccents?"checked":""}> require accents &amp; breathings</label>
        <span class="score" id="typeScore"></span>
      </div>
    </div>`;

  $("#typeTables").querySelectorAll("input").forEach(inp=>{
    inp.addEventListener("input", ()=>{
      const pos = inp.selectionStart, before = inp.value;
      const conv = toGreek(before);
      if(conv !== before){
        inp.value = conv;
        const delta = conv.length - before.length;
        inp.setSelectionRange(pos+delta, pos+delta);
      }
      inp.parentElement.classList.remove("ok","no");
    });
  });
  $("#strict").onchange = e => strictAccents = e.target.checked;
  $("#checkType").onclick = ()=>{
    let ok=0, total=0, blank=0;
    $("#typeTables").querySelectorAll("td.inp").forEach(td=>{
      total++;
      const inp = td.querySelector("input");
      const want = p.data[td.dataset.n][td.dataset.c][+td.dataset.i];
      td.classList.remove("ok","no");
      if(!inp.value.trim()){ blank++; return; }
      const right = sameForm(inp.value, want, strictAccents);
      td.classList.add(right?"ok":"no");
      if(right) ok++;
    });
    $("#typeScore").textContent = `${ok} / ${total} correct` + (blank?` · ${blank} blank`:"");
  };
  $("#revealType").onclick = ()=>{
    $("#typeTables").querySelectorAll("td.inp").forEach(td=>{
      td.querySelector("input").value = p.data[td.dataset.n][td.dataset.c][+td.dataset.i];
      td.classList.remove("no"); td.classList.add("ok");
    });
    $("#typeScore").textContent = "Answers shown.";
  };
  $("#resetType").onclick = ()=>renderType(p);
}

/* ---------------- quick quiz ---------------- */
const qState = {article:{r:0,t:0,s:0}, kalos:{r:0,t:0,s:0}};
function renderQuiz(p){
  $("#content").innerHTML = `
    <div class="panel">
      <h2>Quick Quiz</h2>
      <p class="hint">Both directions: sometimes you get the label, sometimes the Greek.</p>
      <div class="prompt" id="qPrompt"></div>
      <div class="choices" id="qChoices"></div>
      <div class="fb" id="qFb"></div>
      <div class="row">
        <button class="btn ghost" id="qNext">Next &rarr;</button>
        <span class="score" id="qScore"></span>
      </div>
    </div>`;
  const cells = cellsOf(p);
  const forms = [...new Set(cells.map(c=>c.val))];
  const st = qState[curP];
  let lock = false, timer = null;
  const showScore = ()=> $("#qScore").textContent = `${st.r} correct / ${st.t} · streak ${st.s}`;

  function newQ(){
    if($("#qPrompt")===null) return;
    clearTimeout(timer); lock=false;
    $("#qFb").textContent=""; $("#qFb").className="fb";
    const cell = rand(cells);
    const forward = Math.random()<0.65;
    let answer, opts, isGreek;
    if(forward){
      $("#qPrompt").innerHTML = `<b>${label(cell)}</b> — which form?`;
      answer = cell.val; isGreek = true;
      opts = [answer, ...shuffle(forms.filter(f=>f!==answer)).slice(0,3)];
    } else {
      const matches = cells.filter(c=>c.val===cell.val).map(label);
      $("#qPrompt").innerHTML = `<span class="gk" style="font-size:30px">${cell.val}</span> — which of these can it be?`;
      answer = rand(matches); isGreek = false;
      const wrong = [...new Set(cells.map(label))].filter(l=>!matches.includes(l));
      opts = [answer, ...shuffle(wrong).slice(0,3)];
    }
    opts = shuffle(opts);
    $("#qChoices").innerHTML = opts.map(o=>
      `<button class="${isGreek?"":"txt"}">${o}</button>`).join("");
    $("#qChoices").querySelectorAll("button").forEach(b=> b.onclick = ()=>{
      if(lock) return; lock=true; st.t++;
      const right = b.textContent===answer;
      if(right){ st.r++; st.s++; b.classList.add("ok");
        $("#qFb").textContent="Correct."; $("#qFb").className="fb ok"; }
      else{ st.s=0; b.classList.add("no");
        [...$("#qChoices").children].find(x=>x.textContent===answer).classList.add("ok");
        $("#qFb").textContent = `Answer: ${answer}`; $("#qFb").className="fb no"; }
      showScore();
      timer = setTimeout(newQ, right?650:1900);
    });
    showScore();
  }
  $("#qNext").onclick = newQ;
  newQ();
}

/* ---------------- spot it ---------------- */
function renderSpot(p){
  const cells = cellsOf(p);
  const forms = [...new Set(cells.map(c=>c.val))];
  let target = rand(forms);
  $("#content").innerHTML = `
    <div class="panel">
      <h2>Spot It</h2>
      <p class="hint">One form, sometimes several jobs. Click <em>every</em> cell this form can fill, then check.</p>
      <div class="prompt gk" id="sForm" style="font-size:36px">${target}</div>
      <div class="grid2" id="spotTables">${tables(p,(n,c,i)=>
        `<td class="cell" data-n="${n}" data-c="${c}" data-i="${i}">·</td>`)}</div>
      <div class="row">
        <button class="btn" id="checkSpot">Check</button>
        <button class="btn ghost" id="nextSpot">New form</button>
        <span class="score" id="sFb"></span>
      </div>
    </div>`;
  function wire(){
    $("#spotTables").querySelectorAll(".cell").forEach(td=>
      td.onclick = ()=>{ td.classList.remove("ok","no"); td.classList.toggle("pick"); });
  }
  wire();
  $("#checkSpot").onclick = ()=>{
    let wrong=0, missed=0;
    $("#spotTables").querySelectorAll(".cell").forEach(td=>{
      const isRight = p.data[td.dataset.n][td.dataset.c][+td.dataset.i]===target;
      const picked = td.classList.contains("pick");
      td.classList.remove("pick");
      if(picked && isRight) td.classList.add("ok");
      else if(picked){ td.classList.add("no"); wrong++; }
      else if(isRight){ td.classList.add("ok"); td.textContent=target; missed++; }
    });
    $("#sFb").textContent = (wrong||missed)
      ? `${wrong} wrong, ${missed} missed — green cells are the full answer.` : "Perfect.";
  };
  $("#nextSpot").onclick = ()=>renderSpot(p);
}

const head = t => t.split(",")[0].trim();

function vocabPool(){
  const out=[];
  VOCAB.forEach(w=>{ if(V.weeks.has(w.week)) w.items.forEach(it=>out.push({t:it.t,g:it.g,w:w.week})); });

function startDeck(){
  V.deck = shuffle(vocabPool()); V.i=0; V.right=0; V.wrong=0; V.missed=[];
  V.started = true; V.answered = false;
  if($("#vStart")) $("#vStart").textContent = "Restart";
  drawQ();
}

function drawQ(){
  const area = $("#vArea"); if(!area) return;
  if(V.i >= V.deck.length) return drawSummary();
  const item = V.deck[V.i];
  const dir = V.dir==="mix" ? (Math.random()<0.5?"g2e":"e2g") : V.dir;
  V.curDir = dir; V.answered = false;
  const pool = vocabPool();
  const pct = Math.round(V.i/V.deck.length*100);
  const statusBar = `
    <div class="row"><span style="font-size:13px;color:var(--muted)">Week ${item.w} · card ${V.i+1} of ${V.deck.length}</span>

    <div class="barwrap"><div class="bar" style="width:${pct}%"></div></div>`;

  if(V.fmt === "mc"){
    const askGreek = dir==="g2e";
    const key = askGreek ? "g" : "t";
    const answer = item[key];
    const wrong = shuffle(pool.filter(x=>x[key]!==answer)
      .filter((x,ix,arr)=>arr.findIndex(y=>y[key]===x[key])===ix)).slice(0,3).map(x=>x[key]);
    const opts = shuffle([answer,...wrong]);
    area.innerHTML = `<div class="panel">
      <div class="card"><div class="meta">${askGreek?"What does this mean?":"Which Greek word?"}</div>
        <div class="q ${askGreek?"gk":""}">${askGreek?item.t:item.g}</div></div>
      <div class="choices" id="vChoices">${opts.map((o,ix)=>
        `<button class="${askGreek?"txt":""}" data-o="${ix}">${o}</button>`).join("")}</div>
      <div class="fb" id="vFb"></div>${statusBar}</div>`;
    const btns = [...area.querySelectorAll("#vChoices button")];
    btns.forEach(b=> b.onclick = ()=>{
      if(V.answered) return; V.answered = true;
      const ok = b.textContent === answer;
      b.classList.add(ok?"ok":"no");
      if(!ok) btns.find(x=>x.textContent===answer).classList.add("ok");
      score(ok, item, ok ? "Correct." : `${item.t} — ${item.g}`);
      setTimeout(next, ok?600:1800);
    });
    V.keyPick = n => { const b = btns[n]; if(b) b.click(); };
  }

  else if(V.fmt === "card"){
    const front = dir==="g2e" ? item.t : item.g;
    const back  = dir==="g2e" ? item.g : item.t;
    area.innerHTML = `<div class="panel">
      <div class="card">
        <div class="meta">${dir==="g2e"?"Greek → English":"English → Greek"}</div>
        <div class="q ${dir==="g2e"?"gk":""}">${front}</div>
        <div class="a hidden ${dir==="g2e"?"":"gk"}" id="vBack">${back}</div>
      </div>
      <div class="row"><button class="btn" id="vShow">Show answer <span style="opacity:.7">(space)</span></button>
        <span id="vRate" style="display:none">
          <button class="btn ghost" id="vMiss">Missed it (1)</button>
          <button class="btn" id="vKnew">Knew it (2)</button></span></div>
      ${statusBar}</div>`;
    const reveal = ()=>{ $("#vBack").classList.remove("hidden");
      $("#vShow").style.display="none"; $("#vRate").style.display="inline"; };
    $("#vShow").onclick = reveal;
    $("#vMiss").onclick = ()=>{ score(false,item,""); next(); };
    $("#vKnew").onclick = ()=>{ score(true,item,""); next(); };
    V.reveal = reveal;
  }

  else { /* type the Greek */
    area.innerHTML = `<div class="panel">
      <div class="card"><div class="meta">Type the Greek — accents &amp; breathings required</div>
        <div class="q">${item.g}</div>
        <div style="margin-top:18px"><input class="bigin" id="vIn" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="type here…"></div>
      </div>
      <div class="row"><button class="btn" id="vSubmit">Check (enter)</button>
        <button class="btn ghost" id="vSkip">Show answer</button></div>
      <div class="fb" id="vFb"></div>${statusBar}</div>`;
    const inp = $("#vIn"); inp.focus();
    inp.addEventListener("input", ()=>{
      const pos = inp.selectionStart, before = inp.value, conv = toGreek(before);
      if(conv!==before){ inp.value = conv; const d = conv.length-before.length;
        inp.setSelectionRange(pos+d,pos+d); }
    });
    const submit = ()=>{
      if(V.answered) return;
      const val = inp.value.trim(); if(!val) return;
      V.answered = true;
      const ok    = sameForm(head(val), head(item.t), true)  || sameForm(val, item.t, true);
      const close = sameForm(head(val), head(item.t), false) || sameForm(val, item.t, false);
      $("#vFb").className = "fb " + (ok?"ok":"no");
      $("#vFb").innerHTML = ok ? "Correct."
        : (close ? `Right letters, wrong accents or breathing — it's <span class="gk" style="font-size:20px">${item.t}</span>`
                 : `Answer: <span class="gk" style="font-size:20px">${item.t}</span>`);
      score(ok,item,"");
      setTimeout(next, ok?650:2600);
    };
    $("#vSubmit").onclick = submit;
    $("#vSkip").onclick = ()=>{ if(V.answered) return; V.answered=true;
      $("#vFb").className="fb no";
      $("#vFb").innerHTML = `Answer: <span class="gk" style="font-size:20px">${item.t}</span>`;
      score(false,item,""); setTimeout(next,2200); };
    inp.onkeydown = e=>{ if(e.key==="Enter"){ e.preventDefault(); V.answered ? next() : submit(); } };
    V.submit = submit;
  }
}

function score(ok,item,msg){
  if(ok) V.right++; else { V.wrong++; V.missed.push(item); V.deck.push(item); }
  const fb = $("#vFb");
  if(fb && msg){ fb.textContent = msg; fb.className = "fb " + (ok?"ok":"no"); }
}
function next(){ V.i++; drawQ(); }

function drawSummary(){
  const uniq = [...new Map(V.missed.map(m=>[m.t,m])).values()];
  const total = V.right + V.wrong;
  $("#vArea").innerHTML = `<div class="panel">
    <h2>Round complete</h2>
    <p style="font-size:15px">${V.right} of ${total} correct
      <span style="color:var(--muted)">(${total?Math.round(V.right/total*100):0}%)</span></p>
    ${uniq.length ? `<p class="hint" style="margin-bottom:6px">Words you missed:</p>
      <ul class="missed">${uniq.map(m=>`<li><span class="gk">${m.t}</span> — ${m.g}
        <span style="color:var(--muted);font-size:12px">(wk ${m.w})</span></li>`).join("")}</ul>`
      : `<p class="hint">Clean sweep — nothing missed.</p>`}
    <div class="row">
      <button class="btn" id="vAgain">Go again</button>
      ${uniq.length?`<button class="btn ghost" id="vDrill">Drill missed only (${uniq.length})</button>`:""}
    </div></div>`;
  $("#vAgain").onclick = startDeck;
  if(uniq.length) $("#vDrill").onclick = ()=>{
    V.deck = shuffle(uniq); V.i=0; V.right=0; V.wrong=0; V.missed=[]; V.answered=false; drawQ();
  };
}

document.addEventListener("keydown", e=>{
  if(curP!=="vocab" || !V.started) return;
  if(e.target.tagName === "INPUT" && V.fmt==="type") return;
  if(V.fmt==="card"){
    if(e.code==="Space"){ e.preventDefault();
      $("#vShow") && $("#vShow").style.display!=="none" ? V.reveal() : null; }
    if(e.key==="1" && $("#vMiss")) $("#vMiss").click();
    if(e.key==="2" && $("#vKnew")) $("#vKnew").click();
  }
  if(V.fmt==="mc" && "1234".includes(e.key)) V.keyPick(+e.key-1);
});

render();
</script>
</body>
</html>
